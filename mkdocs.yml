site_name: Compute & Cook
site_url: https://almanach.pateenchroot.ovh
site_description: Computers & Cooking cheatsheets

repo_name: pfrayer/almanach
repo_url: https://github.com/pfrayer/almanach
edit_uri: https://github.com/pfrayer/almanach/tree/master/src/

docs_dir: src
site_dir: site

nav:
- Computers (🇬🇧):
  - AI:
    - Claude Code: docs/compute/ai/claude_code.md
    - Copilot CLI: docs/compute/ai/copilot_cli.md
    - OpenCode: docs/compute/ai/opencode.md
  - ArchLinux: docs/compute/archlinux.md
  - AWS S3 CLI: docs/compute/aws_s3_cli.md
  - Bash:
    - General: docs/compute/bash/general.md
    - awk: docs/compute/bash/awk.md
    - sed: docs/compute/bash/sed.md
  - curl: docs/compute/curl.md
  - Debian: docs/compute/debian.md
  - DNS: docs/compute/dns.md
  - Docker: docs/compute/docker.md
  - Git: docs/compute/git.md
  - GitHub Actions: docs/compute/github_actions.md
  - Helm: docs/compute/helm.md
  - Images, videos, PDF: docs/compute/images.md
  - jq / yq: docs/compute/jq_yq.md
  - Kubernetes: docs/compute/kubernetes.md
  - Logs: docs/compute/logs.md
  - MongoDB: docs/compute/mongodb.md
  - Network: docs/compute/network.md
  - OpenSearch: docs/compute/opensearch.md
  - PGP / GPG: docs/compute/pgp.md
  - PostgreSQL: docs/compute/postgres.md
  - Python:
    - General: docs/compute/python/general.md
    - asyncio: docs/compute/python/asyncio.md
    - Poetry: docs/compute/python/poetry.md
    - pyenv: docs/compute/python/pyenv.md
    - pytest: docs/compute/python/pytest.md
  - SSH: docs/compute/ssh.md
  - SSL / TLS: docs/compute/ssl.md
  - systemd: docs/compute/systemd.md
  - Vim: docs/compute/vim.md
- Cooking (🇫🇷):
  - Sucré:
    - Granola: docs/cook/granola.md
    - Tiramisu: docs/cook/tiramisu.md
    - Brownie: docs/cook/brownie.md
  - Salé:
    - Pâtes: docs/cook/pate.md
    - Moussaka: docs/cook/moussaka.md
    - Sans gluten: docs/cook/no_gluten.md

theme:
  name: material
  logo: assets/images/favicon.png
  palette:
    primary: orange
    accent: amber
  font:
    text: Roboto
    code: Roboto Mono
  language: en
  features:
  - announce.dismiss
  - content.action.view
  - content.code.annotate
  - content.code.copy
  - content.code.select
  - navigation.expand
  - navigation.indexes
  - navigation.instant
  - navigation.path
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.tracking
  - search.highlight
  - search.suggest
  - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
- search:
    lang:
    - en
    - fr
- git-revision-date-localized:
    type: datetime
    fallback_to_build_date: true
- minify:
    minify_html: true
    htmlmin_opts:
      remove_comments: true

extra_css:
- assets/css/fonts.css
- assets/css/extra.css
- assets/css/code.css

markdown_extensions:
- abbr
- admonition
- attr_list
- def_list
- md_in_html
- pymdownx.details
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji ""
    emoji_generator: !!python/name:material.extensions.emoji.to_svg ""
- pymdownx.highlight:
    use_pygments: true
    linenums: true
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- pymdownx.inlinehilite
- pymdownx.keys
- pymdownx.mark
- pymdownx.smartsymbols
- pymdownx.snippets:
    check_paths: true
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.tasklist:
    custom_checkbox: true
- pymdownx.tilde
