site_name: Compute & Cook
site_url: https://almanach.pateenchroot.ovh
site_description: Computers & Cooking cheatsheets
copyright: Compute & Cook · cheatsheets & recettes, tenus à la main

repo_name: pfrayer/almanach
repo_url: https://github.com/pfrayer/almanach
edit_uri: https://github.com/pfrayer/almanach/tree/master/src/

docs_dir: src
site_dir: site

hooks:
- hooks/recipes.py

nav:
- Computers 🇬🇧:
  - docs/compute/index.md
  - AI:
    - Claude Code:
      - General: docs/compute/ai/claude_code.md
      - Agents & teammates: docs/compute/ai/claude_code_agents.md
    - Copilot CLI: docs/compute/ai/copilot_cli.md
    - OpenCode: docs/compute/ai/opencode.md
  - ArchLinux: docs/compute/archlinux.md
  - AWS S3 CLI: docs/compute/aws_s3_cli.md
  - Bash:
    - General: docs/compute/bash/general.md
    - awk: docs/compute/bash/awk.md
    - sed: docs/compute/bash/sed.md
  - curl: docs/compute/curl.md
  - Debian: docs/compute/debian.md
  - DNS: docs/compute/dns.md
  - Docker: docs/compute/docker.md
  - Git: docs/compute/git.md
  - GitHub Actions: docs/compute/github_actions.md
  - Helm: docs/compute/helm.md
  - Images, videos, PDF: docs/compute/images.md
  - jq / yq: docs/compute/jq_yq.md
  - Kubernetes: docs/compute/kubernetes.md
  - Logs: docs/compute/logs.md
  - MongoDB: docs/compute/mongodb.md
  - Network: docs/compute/network.md
  - OpenSearch: docs/compute/opensearch.md
  - PGP / GPG: docs/compute/pgp.md
  - PostgreSQL: docs/compute/postgres.md
  - Python:
    - General: docs/compute/python/general.md
    - asyncio: docs/compute/python/asyncio.md
    - Poetry: docs/compute/python/poetry.md
    - pyenv: docs/compute/python/pyenv.md
    - pytest: docs/compute/python/pytest.md
  - SSH: docs/compute/ssh.md
  - SSL / TLS: docs/compute/ssl.md
  - systemd: docs/compute/systemd.md
  - Vim: docs/compute/vim.md
- Cooking 🇫🇷:
  - docs/cook/index.md
  - Sucré:
    - Brownie: docs/cook/brownie.md
    - Cookies:
      - Beurre noisette et fleur de sel: docs/cook/cookies/beurre_noisette.md
      - Chocolat-pécan: docs/cook/cookies/chocolat_pecan.md
      - Matcha-chocolat: docs/cook/cookies/matcha_chocolat.md
    - Flan pâtissier: docs/cook/flan.md
    - Granola: docs/cook/granola.md
    - Tiramisu: docs/cook/tiramisu.md
  - Salé:
    - Aubergines teriyaki: docs/cook/aubergine_roties.md
    - Focaccia: docs/cook/focaccia.md
    - Moussaka: docs/cook/moussaka.md
    - Pad see ew: docs/cook/pad_see_ew.md
    - Polenta fromagère: docs/cook/polenta_fromagere.md
    - Poulet Gaston Gérard: docs/cook/poulet_gaston_gerard.md
    - Poulet karaage: docs/cook/karaage.md
    - Tarte tomate moutarde: docs/cook/tarte_tomate_moutarde.md
    - Tartiflette et croziflette: docs/cook/tartiflette.md
  - Bases:
    - Pâte brisée: docs/cook/pates/brisee.md
    - Pâte feuilletée: docs/cook/pates/feuilletee.md
    - Pâte sablée: docs/cook/pates/sablee.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/favicon.png
  palette:
    primary: orange
    accent: amber
  font:
    text: Roboto
    code: Roboto Mono
  language: en
  features:
  - announce.dismiss
  - content.action.view
  - content.code.annotate
  - content.code.copy
  - content.code.select
  - navigation.expand
  - navigation.footer
  - navigation.indexes
  - navigation.instant
  - navigation.path
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.top
  - navigation.tracking
  - search.highlight
  - search.suggest
  - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
- meta
- search:
    lang:
    - en
    - fr
- git-revision-date-localized:
    type: date
    fallback_to_build_date: true
    exclude:
    - index.md
    - docs/*/index.md
- minify:
    minify_html: true
    htmlmin_opts:
      remove_comments: true

extra:
  generator: false

extra_css:
- assets/css/fonts.css
- assets/css/extra.css
- assets/css/code.css

extra_javascript:
- assets/js/language.js
- assets/js/recipe.js

markdown_extensions:
- abbr
- admonition
- attr_list
- def_list
- md_in_html
- pymdownx.details
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji ""
    emoji_generator: !!python/name:material.extensions.emoji.to_svg ""
- pymdownx.highlight:
    use_pygments: true
    linenums: true
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- pymdownx.inlinehilite
- pymdownx.keys
- pymdownx.mark
- pymdownx.smartsymbols
- pymdownx.snippets:
    check_paths: true
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.tasklist:
    custom_checkbox: true
- pymdownx.tilde
