name: CI

"on":
  pull_request:
  push:
    branches:
    - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # git-revision-date-localized needs the full history
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.15"
        cache: pip

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Build site
      run: mkdocs build --strict -f mkdocs.yml -d site

    - name: Build Docker image
      run: docker build --tag almanach:ci .

  # A red master, or a red Renovate PR (its automerge would stall silently):
  # push to ntfy.pateenchroot.ovh, topic deploy (secret NTFY_TOKEN, the same
  # publisher token as pfrayer/pateenchroot). Best effort: never fails the run.
  notify-failure:
    needs: build
    if: >-
      failure()
      && ((github.ref == 'refs/heads/master' && github.event_name != 'pull_request')
          || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/')))
    runs-on: ubuntu-latest

    steps:
    - name: Notify
      env:
        NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        # through env, never inline: a commit message or PR title is free text
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [[ -n "$PR_NUMBER" ]]; then
          title="CI failed: ${GITHUB_REPOSITORY#*/} PR #${PR_NUMBER}" priority=3 what=$PR_TITLE
        else
          title="CI failed: ${GITHUB_REPOSITORY#*/} master ${GITHUB_SHA:0:7}" priority=4
          what=${COMMIT_MESSAGE%%$'\n'*}
        fi
        jq -n --arg title "$title" --arg message "${what:-manual run}"$'\n'"$RUN_URL" \
          --argjson priority "$priority" '{topic: "deploy", $title, $message, $priority}' \
          | curl -fsS --max-time 15 -o /dev/null -H "Authorization: Bearer $NTFY_TOKEN" \
              -H 'Content-Type: application/json' --data-binary @- https://ntfy.pateenchroot.ovh \
          || echo "::warning::notification not sent"
