name: CI

"on":
  pull_request:
  push:
    branches:
    - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # git-revision-date-localized needs the full history
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.15"
        cache: pip

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Build site
      run: mkdocs build --strict -f mkdocs.yml -d site

    - name: Build Docker image
      run: docker build --tag almanach:ci .
